<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>레시피 모음</title>
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#1d2a2b;--sub:#5b6b6c;--line:#d5dedb;--accent:#2d4a7c;--accent-ink:#fff;--tile:#e6edf5}
@media (prefers-color-scheme:dark){:root{--bg:#14191a;--card:#1c2425;--ink:#e8eeee;--sub:#9fb0b1;--line:#2f3b3c;--accent:#8fb0ea;--accent-ink:#0f1a2e;--tile:#243040}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 48px}
header{padding:40px 0 20px}
h1{font-size:2rem;margin:0 0 6px;letter-spacing:-.02em}
header p{margin:0;color:var(--sub)}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 20px}
input[type=search]{flex:1 1 240px;padding:10px 14px;font-size:1rem;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cats button{padding:9px 16px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font-size:.95rem;cursor:pointer}
.cats button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible,a:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:0;margin:0;list-style:none}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;padding:0;color:inherit;font:inherit}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:3.6rem;background:var(--tile)}
.thumb img{width:100%;height:100%;object-fit:cover}
.card .t{padding:12px 14px}
.card strong{display:block}
.card span{font-size:.85rem;color:var(--sub)}
#empty{text-align:center;color:var(--sub);padding:48px 0}
dialog{width:min(640px,94vw);max-height:90vh;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(0,0,0,.5)}
.d{padding:22px 24px 26px}
.d h2{margin:0 0 4px}
.meta{display:flex;gap:16px;flex-wrap:wrap;color:var(--sub);margin:6px 0 14px;font-size:.95rem}
.d h3{margin:18px 0 6px;font-size:1.05rem}
.d ul,.d ol{margin:0;padding-left:22px}
.tip{background:var(--tile);padding:10px 14px;border-radius:8px;margin-top:6px}
.close{float:right;padding:8px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer;font-size:.95rem}
.src a{color:var(--accent)}
.src small{display:block;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>레시피 모음</h1>
<p>한식·양식·디저트 레시피를 이름과 분류로 찾아보세요.</p>
</header>
<div class="tools">
<input type="search" id="q" placeholder="요리 이름 검색" aria-label="요리 이름 검색">
<div class="cats" id="cats" role="group" aria-label="카테고리"></div>
</div>
<ul id="list"></ul>
<p id="empty" hidden>검색 결과가 없습니다</p>
</div>
<dialog id="dlg" aria-labelledby="dt"></dialog>

<script>
/* 레시피 자료는 AI 초안입니다. 출처 확인·검수 후 수정하세요.
   image: 허가 확인된 https 이미지 주소를 넣으면 사진으로 표시됩니다. 비워 두면 기본 이미지(이모지)를 씁니다.
   url: 원본 레시피 확정 시 교체하세요. 현재는 만개의레시피 검색 결과 페이지로 연결됩니다. */
var SEARCH="https://www.10000recipe.com/recipe/list.html?q=";
var R=[
{t:"김치찌개",c:"한식",e:"🍲",time:"35분",s:"2~3인분",lv:"쉬움",
 ing:["잘 익은 배추김치 2컵(약 300g)","돼지고기(앞다리살) 150g","두부 1/2모","대파 1대","물 또는 쌀뜨물 3컵","고춧가루 1큰술","다진 마늘 1작은술"],
 st:["냄비에 돼지고기와 김치를 넣고 중불에서 3~4분 볶는다.","물을 붓고 고춧가루, 다진 마늘을 넣어 끓인다.","끓어오르면 중약불로 줄여 15분 더 끓인다.","두부와 대파를 넣고 5분 더 끓인다."],
 tip:"김치가 신 정도에 따라 간을 조절하세요. 돼지고기는 속까지 완전히 익혀야 합니다."},
{t:"김치볶음밥",c:"한식",e:"🍛",time:"15분",s:"1인분",lv:"쉬움",
 ing:["밥 1공기(210g)","배추김치 1/2컵","대파 1/2대","식용유 1큰술","참기름 1작은술","계란 1개"],
 st:["김치는 잘게 썰고 대파는 송송 썬다.","팬에 기름을 두르고 대파를 볶아 향을 낸다.","김치를 넣고 3분 정도 볶는다.","밥을 넣고 고루 볶은 뒤 참기름을 두른다.","계란프라이를 올린다."],
 tip:"찬밥을 쓰면 질척이지 않습니다. 달걀은 노른자까지 익혀 드세요."},
{t:"된장찌개",c:"한식",e:"🥘",time:"30분",s:"2인분",lv:"쉬움",
 ing:["된장 2큰술","애호박 1/3개","양파 1/2개","두부 1/2모","멸치 육수 2컵","청양고추 1개","다진 마늘 1/2큰술"],
 st:["육수에 된장을 풀어 끓인다.","애호박, 양파를 깍둑 썰어 넣는다.","끓어오르면 5분 더 끓인다.","두부, 마늘, 고추를 넣고 3분 더 끓인다."],
 tip:"된장마다 염도가 다르니 처음엔 적게 풀고 맛을 보며 더하세요."},
{t:"불고기",c:"한식",e:"🥩",time:"40분(재움 30분 별도)",s:"3인분",lv:"보통",
 ing:["소고기 불고기용 400g","간장 4큰술","설탕 2큰술","배즙 3큰술","다진 마늘 1큰술","참기름 1큰술","양파 1/2개","대파 1대"],
 st:["양념 재료를 섞어 소고기에 버무린 뒤 30분 재운다.","양파와 대파를 채 썬다.","달군 팬에 고기를 펴서 볶는다.","채소를 넣고 고기가 완전히 익을 때까지 볶는다."],
 tip:"고기는 겉과 속이 모두 갈색으로 익을 때까지 충분히 가열하세요."},
{t:"잡채",c:"한식",e:"🍜",time:"45분",s:"3~4인분",lv:"보통",
 ing:["당면 200g","시금치 1줌","당근 1/2개","양파 1/2개","소고기 100g","간장 4큰술","설탕 1.5큰술","참기름 2큰술"],
 st:["당면을 삶아 찬물에 헹궈 물기를 뺀다.","시금치는 데치고 당근, 양파는 채 썰어 각각 볶는다.","고기는 간장·설탕으로 밑간해 완전히 익힌다.","큰 볼에 모두 넣고 간장, 설탕, 참기름으로 버무린다."],
 tip:"재료를 따로 볶아야 색과 식감이 살아납니다."},
{t:"토마토 스파게티",c:"양식",e:"🍝",time:"25분",s:"2인분",lv:"쉬움",
 ing:["스파게티면 200g","토마토소스 1.5컵","양파 1/2개","마늘 3쪽","올리브유 2큰술","소금 약간","파마산 치즈 약간"],
 st:["끓는 소금물에 면을 포장지 시간보다 1분 짧게 삶는다.","팬에 올리브유, 다진 마늘과 양파를 볶는다.","토마토소스를 넣고 5분 끓인다.","면을 넣고 면수 3큰술과 함께 버무린다."],
 tip:"면수를 조금 넣으면 소스가 면에 잘 달라붙습니다."},
{t:"크림 파스타",c:"양식",e:"🥛",time:"25분",s:"2인분",lv:"보통",
 ing:["펜네 또는 스파게티 200g","생크림 1컵","우유 1/2컵","베이컨 4줄","양파 1/2개","마늘 2쪽","소금·후추 약간"],
 st:["면을 삶아 건진다.","베이컨, 양파, 마늘을 볶는다.","생크림과 우유를 붓고 약불에서 끓인다.","면을 넣고 소스가 걸쭉해질 때까지 졸인다."],
 tip:"센 불로 끓이면 크림이 분리될 수 있으니 약불을 유지하세요."},
{t:"치킨 시저 샐러드",c:"양식",e:"🥗",time:"25분",s:"2인분",lv:"보통",
 ing:["닭가슴살 200g","로메인 상추 1통","파마산 치즈 3큰술","식빵 1장","마요네즈 3큰술","레몬즙 1큰술","다진 마늘 1/2작은술"],
 st:["닭가슴살에 소금·후추를 하고 팬에서 속까지 완전히 익힌다.","식빵은 깍둑 썰어 노릇하게 굽는다.","마요네즈, 레몬즙, 마늘, 치즈 1큰술로 드레싱을 만든다.","상추에 닭고기, 빵, 드레싱, 치즈를 올린다."],
 tip:"닭고기는 가장 두꺼운 부분이 75℃ 이상이 되도록 익히세요."},
{t:"치즈 오믈렛",c:"양식",e:"🍳",time:"10분",s:"1인분",lv:"보통",
 ing:["계란 3개","우유 1큰술","슬라이스 치즈 1장","버터 10g","소금 한 꼬집"],
 st:["계란, 우유, 소금을 풀어 체에 한 번 거른다.","팬에 버터를 녹이고 계란물을 붓는다.","젓가락으로 저어 반숙 상태가 되면 치즈를 올린다.","반으로 접어 접시에 담는다."],
 tip:"불은 중약불로 유지하세요. 계란은 충분히 익혀 드세요."},
{t:"팬케이크",c:"디저트",e:"🥞",time:"20분",s:"2인분",lv:"쉬움",
 ing:["박력분 150g","우유 150ml","계란 1개","설탕 2큰술","베이킹파우더 1작은술","버터 약간"],
 st:["계란, 우유, 설탕을 섞는다.","가루 재료를 체 쳐 넣고 덩어리가 조금 남게 섞는다.","약불 팬에 반죽을 한 국자 붓는다.","기포가 올라오면 뒤집어 1~2분 더 굽는다."],
 tip:"반죽을 너무 오래 저으면 질겨집니다."},
{t:"초코칩 쿠키",c:"디저트",e:"🍪",time:"40분",s:"12개",lv:"보통",
 ing:["박력분 200g","버터 100g","설탕 80g","황설탕 60g","계란 1개","초코칩 100g","베이킹소다 1/2작은술"],
 st:["오븐을 175℃로 예열한다.","버터와 설탕을 크림 상태로 섞고 계란을 넣는다.","가루 재료와 초코칩을 넣어 섞는다.","한 숟갈씩 팬에 간격을 두고 올려 10~12분 굽는다."],
 tip:"오븐마다 화력이 다르니 가장자리 색을 보며 시간을 조절하세요."},
{t:"요거트 과일볼",c:"디저트",e:"🍓",time:"5분",s:"1인분",lv:"쉬움",
 ing:["플레인 요거트 200g","딸기 5개","바나나 1/2개","그래놀라 3큰술","꿀 1작은술"],
 st:["과일을 한입 크기로 썬다.","그릇에 요거트를 담는다.","과일과 그래놀라를 올린다.","꿀을 둘러 완성한다."],
 tip:"그래놀라는 먹기 직전에 올려야 바삭합니다."}
];
var cat="전체",cats=["전체","한식","양식","디저트"];
var list=document.getElementById("list"),q=document.getElementById("q"),
    empty=document.getElementById("empty"),dlg=document.getElementById("dlg"),cb=document.getElementById("cats");

cats.forEach(function(n){
  var b=document.createElement("button");b.type="button";b.textContent=n;
  b.setAttribute("aria-pressed",n===cat);
  b.onclick=function(){cat=n;[].forEach.call(cb.children,function(x){x.setAttribute("aria-pressed",x===b)});render()};
  cb.appendChild(b);
});

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function thumb(r){
  var d=document.createElement("div");d.className="thumb";d.textContent=r.e;
  if(r.image){var i=new Image();i.alt=r.t;i.onload=function(){d.textContent="";d.appendChild(i)};i.src=r.image}
  return d;
}

function render(){
  var k=q.value.trim().toLowerCase();
  list.innerHTML="";var n=0;
  R.forEach(function(r,idx){
    if(cat!=="전체"&&r.c!==cat)return;
    if(k&&r.t.toLowerCase().indexOf(k)<0)return;
    n++;
    var li=document.createElement("li"),b=document.createElement("button");
    b.type="button";b.className="card";
    b.appendChild(thumb(r));
    var t=document.createElement("div");t.className="t";
    t.innerHTML="<strong>"+esc(r.t)+"</strong><span>"+esc(r.c)+" · "+esc(r.time)+"</span>";
    b.appendChild(t);b.onclick=function(){openR(idx)};
    li.appendChild(b);list.appendChild(li);
  });
  empty.hidden=n>0;
}

function openR(i){
  var r=R[i],url=r.url||SEARCH+encodeURIComponent(r.t);
  dlg.innerHTML='<div class="d"><button class="close" type="button" id="x">닫기</button>'+
   '<h2 id="dt">'+esc(r.t)+'</h2>'+
   '<div class="meta"><span>조리 시간 '+esc(r.time)+'</span><span>'+esc(r.s)+'</span><span>난이도 '+esc(r.lv)+'</span></div>'+
   '<h3>재료와 분량</h3><ul>'+r.ing.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul>'+
   '<h3>만드는 방법</h3><ol>'+r.st.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ol>'+
   '<h3>요리 팁</h3><div class="tip">'+esc(r.tip)+'</div>'+
   '<h3>원본 레시피</h3><p class="src"><a href="'+url+'" target="_blank" rel="noopener noreferrer">'+esc(r.src||"만개의레시피에서 "+r.t+" 찾아보기")+'</a>'+
   '<small>인터넷 연결이 필요합니다.</small></p></div>';
  document.getElementById("x").onclick=function(){dlg.close()};
  dlg.showModal();
}
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
q.addEventListener("input",render);
render();
</script>
</body>
</html>
